<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Punktekonto">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2F6F9F">
<title>Punktekonto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F8E9D2;
    --card:#FFF9F0;
    --ink:#4A3324;
    --ink-soft:#8C7362;
    --line:#EAD5B0;

    --pk:#2F6F9F;
    --pk-soft:#D6E5F1;
    --weight:#5F8A3E;
    --house:#C1477A;
    --house-soft:#F3D9E5;
    --sport:#B9762F;
    --sport-soft:#F2E2C8;
    --weight-soft:#DCEAC9;
    --warn:#D8622F;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:640px;margin:0 auto;padding:20px 16px 60px;}

  header{padding:8px 4px 16px;}
  header h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:1.95rem;
    margin:0 0 4px;
    letter-spacing:-0.01em;
    color:var(--pk);
  }
  header p{margin:0;color:var(--ink-soft);font-size:0.92rem;font-style:italic;}
  header .divider{
    margin:10px 0 2px;
    letter-spacing:0.4em;
    font-size:0.7rem;
    color:var(--weight);
  }

  .people{display:flex;gap:6px;margin:14px 0 12px;flex-wrap:wrap;}
  .person{
    font-family:'Fraunces',serif;font-weight:600;font-size:0.84rem;
    border:1px solid var(--line);background:transparent;color:var(--ink-soft);
    border-radius:20px;padding:7px 16px;cursor:pointer;
  }
  .person.active{background:var(--pk);color:#fff;border-color:var(--pk);}

  .tabs{
    display:flex;gap:6px;margin-bottom:0;position:relative;z-index:1;
    overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:1 1 0;min-width:92px;text-align:center;
    padding:11px 10px 13px;
    font-family:'Fraunces',serif;font-weight:600;font-size:0.86rem;
    border:none;cursor:pointer;border-radius:10px 10px 0 0;
    background:var(--line);color:var(--ink-soft);
    transform:translateY(6px);
    transition:transform .15s ease, background .15s ease, color .15s ease;
  }
  .tab.active{transform:translateY(0);color:#fff;box-shadow:0 -2px 8px rgba(0,0,0,.08);}
  .tab[data-tab="today"].active{background:var(--pk);}
  .tab[data-tab="weight"].active{background:var(--weight);}
  .tab[data-tab="house"].active{background:var(--house);}
  .tab[data-tab="profile"].active{background:var(--ink);}

  .card{
    background:var(--card);
    border-radius:4px 18px 18px 18px;
    border:1px solid var(--line);
    padding:18px;
    min-height:300px;
    box-shadow:0 6px 20px rgba(74,51,36,.10);
  }
  .section-title{font-family:'Fraunces',serif;font-weight:600;font-size:1.15rem;margin:0 0 12px;}
  .muted{color:var(--ink-soft);font-size:0.88rem;}

  button.action{
    font-family:'Inter',sans-serif;font-weight:600;font-size:0.85rem;
    border:none;border-radius:20px;padding:8px 16px;cursor:pointer;
    background:var(--ink);color:#fff;
  }
  button.ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--line);}
  button.small{padding:5px 10px;font-size:0.78rem;}
  button.pk{background:var(--pk);}
  button:disabled{opacity:.5;cursor:default;}
  input,textarea,select{
    font-family:'Inter',sans-serif;font-size:0.9rem;
    padding:8px 10px;border:1px solid var(--line);border-radius:10px;
    background:#fff;color:var(--ink);width:100%;
  }
  .row{display:flex;gap:8px;align-items:center;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:0.78rem;color:var(--ink-soft);margin-bottom:4px;}

  /* ---- Ring ---- */
  .ringwrap{display:flex;flex-direction:column;align-items:center;padding:6px 0 4px;}
  .ringbox{position:relative;width:196px;height:196px;}
  .ringbox svg{width:196px;height:196px;}
  .ring-bg{fill:none;stroke:var(--pk-soft);stroke-width:15;}
  .ring-fg{
    fill:none;stroke:var(--pk);stroke-width:15;stroke-linecap:round;
    transform:rotate(-90deg);transform-origin:98px 98px;
    transition:stroke-dashoffset .5s ease;
  }
  .ring-fg.over{stroke:var(--warn);}
  .ringmid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .ringnum{font-family:'Fraunces',serif;font-weight:600;font-size:3.2rem;line-height:1;color:var(--ink);}
  .ringsub{font-size:0.78rem;color:var(--ink-soft);margin-top:4px;}
  .ringstatus{margin:12px 0 0;font-weight:600;font-size:0.95rem;}
  .ringstatus.over{color:var(--warn);}

  .stats{display:flex;gap:8px;width:100%;margin-top:16px;}
  .stat{
    flex:1;background:var(--paper);border-radius:12px;padding:10px 6px;
    display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);
  }
  .stat b{font-family:'Fraunces',serif;font-size:1rem;}
  .stat span{font-size:0.7rem;color:var(--ink-soft);}

  .hinweis{
    background:var(--weight-soft);border:1px solid var(--line);border-radius:14px;
    padding:13px 15px;margin-top:16px;display:flex;flex-direction:column;gap:2px;
  }
  .hinweis b{font-family:'Fraunces',serif;font-weight:600;font-size:0.95rem;}
  .hinweis span{font-size:0.84rem;color:var(--ink-soft);}

  /* ---- Mahlzeiten ---- */
  .meal{border-top:1px solid var(--line);padding:14px 0 6px;}
  .meal:first-of-type{border-top:none;}
  .meal-head{display:flex;justify-content:space-between;align-items:center;}
  .meal-head h3{font-family:'Fraunces',serif;font-weight:600;font-size:1rem;margin:0;}
  .badge{
    background:var(--pk-soft);color:var(--pk);font-weight:700;font-size:0.82rem;
    padding:4px 12px;border-radius:20px;
  }
  .items{list-style:none;margin:10px 0 0;padding:0;}
  .items li{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px dashed var(--line);}
  .items li:first-child{border-top:none;}
  .it-txt{flex:1;min-width:0;}
  .it-name{font-size:0.9rem;font-weight:500;display:block;}
  .it-meta{font-size:0.74rem;color:var(--ink-soft);}
  .it-pts{font-family:'Fraunces',serif;font-weight:600;font-size:0.95rem;}
  .del{background:none;border:none;color:var(--ink-soft);font-size:1.3rem;line-height:1;cursor:pointer;padding:0 2px;}
  .addbtn{
    margin-top:10px;width:100%;background:transparent;border:1px dashed var(--line);
    border-radius:12px;padding:11px;color:var(--ink-soft);font-size:0.84rem;
    font-family:'Inter',sans-serif;cursor:pointer;
  }
  .addbtn:hover{border-color:var(--pk);color:var(--pk);}

  .sportbox{
    background:var(--sport-soft);border:1px solid var(--line);border-radius:16px;
    padding:14px 16px;margin-top:14px;
  }
  .sportbox .addbtn{background:#fff;}
  .intensity-row{display:flex;gap:6px;}
  .intensity-chip{
    flex:1;background:#fff;border:1.5px solid var(--line);border-radius:12px;
    padding:9px 6px;cursor:pointer;text-align:center;font-family:'Inter',sans-serif;
    display:flex;flex-direction:column;gap:2px;
  }
  .intensity-chip b{font-size:0.86rem;}
  .intensity-chip span{font-size:0.66rem;color:var(--ink-soft);line-height:1.25;}
  .intensity-chip.active{border-color:var(--sport);background:var(--sport-soft);}

  /* ---- Haus ---- */
  .hausbox{
    background:var(--house-soft);border:1px solid var(--line);border-radius:16px;
    padding:18px;display:flex;flex-direction:column;align-items:center;gap:3px;
  }
  .haus-zahl{font-family:'Fraunces',serif;font-weight:600;font-size:2.8rem;line-height:1;color:var(--house);}
  .haus-von{font-size:1.2rem;opacity:.6;}
  .haus-label{font-size:0.84rem;color:var(--ink-soft);}
  .haus-jubel{font-size:0.86rem;font-weight:600;color:var(--house);margin-top:6px;text-align:center;}

  .punkte-woche{display:flex;gap:4px;margin-top:6px;}
  .punkte-woche i{
    width:13px;height:13px;border-radius:50%;
    background:var(--line);display:inline-block;
  }
  .punkte-woche i.an{background:var(--house);}

  .badges{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;}
  .badges::-webkit-scrollbar{display:none;}
  .badge-k{
    flex:0 0 108px;background:var(--paper);border:1px solid var(--line);border-radius:14px;
    padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;
    opacity:.55;
  }
  .badge-k.done{opacity:1;background:var(--house-soft);border-color:var(--house);}
  .b-icon{font-size:1.7rem;line-height:1.2;}
  .b-label{font-family:'Fraunces',serif;font-weight:600;font-size:0.8rem;}
  .b-note{font-size:0.66rem;color:var(--ink-soft);line-height:1.3;}

  .balken{background:var(--line);border-radius:20px;height:12px;overflow:hidden;}
  .balken span{display:block;height:100%;background:var(--house);border-radius:20px;transition:width .4s ease;}

  /* ---- Modal ---- */
  .overlay{
    position:fixed;inset:0;background:rgba(74,51,36,.45);z-index:60;
    display:flex;align-items:flex-end;justify-content:center;
  }
  .sheet{
    background:var(--card);width:100%;max-width:640px;
    border-radius:20px 20px 0 0;padding:8px 18px 28px;
    max-height:88vh;overflow-y:auto;
  }
  .grip{width:38px;height:4px;background:var(--line);border-radius:2px;margin:0 auto 14px;}
  .sheet h3{font-family:'Fraunces',serif;font-weight:600;font-size:1.15rem;margin:0 0 14px;}
  .stepper{font-size:0.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 4px;}
  .results{list-style:none;margin:14px 0 0;padding:0;}
  .grouphead{
    font-family:'Fraunces',serif;font-weight:600;font-size:0.8rem;
    color:var(--ink-soft);letter-spacing:0.06em;text-transform:uppercase;
    margin:18px 0 -4px;
  }
  .results li{border-top:1px solid var(--line);}
  .results button{
    width:100%;text-align:left;background:none;border:none;padding:11px 0;cursor:pointer;
    display:flex;flex-direction:column;gap:2px;font-family:'Inter',sans-serif;
  }
  .r-name{font-size:0.9rem;font-weight:500;color:var(--ink);}
  .r-meta{font-size:0.74rem;color:var(--ink-soft);}
  .preview{
    margin-top:16px;background:var(--pk-soft);border-radius:14px;padding:16px;
    display:flex;flex-direction:column;align-items:center;
  }
  .preview b{font-family:'Fraunces',serif;font-size:2.4rem;color:var(--pk);line-height:1;}
  .preview span{font-size:0.78rem;color:var(--pk);margin-top:2px;}

  /* ---- Chart ---- */
  .chart{width:100%;margin-top:10px;}
  .chart polyline{fill:none;stroke:var(--weight);stroke-width:2.5;stroke-linejoin:round;}
  .chart circle{fill:var(--weight);}

  #toast{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;padding:10px 18px;border-radius:20px;
    font-size:0.85rem;opacity:0;pointer-events:none;transition:all .2s ease;z-index:80;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  #toast.error{background:var(--warn);}

  .backlink{
    display:inline-block;margin-top:18px;font-size:0.82rem;color:var(--ink-soft);
    text-decoration:none;border-bottom:1px solid var(--line);
  }
  @media (prefers-reduced-motion: reduce){ .ring-fg{transition:none;} }

  /* Alternatives Erscheinungsbild für Elena – eigenes Farbschema im vertrauten Yazio-Gefühl:
     klares Teal statt warmes Fraunces-Design, Systemschrift statt Serife, mehr Weißraum.
     Bewusst kein Nachbau von Logo oder exakter Markenfarbe. */
  body.theme-vital{
    --paper:#F4F7F6; --card:#FFFFFF; --ink:#1B2B29; --ink-soft:#6E7E7B; --line:#E3ECEA;
    --pk:#00A896; --pk-soft:#DAF3EF;
    --weight:#00A896; --weight-soft:#DAF3EF;
    --house:#00A896; --house-soft:#DAF3EF;
    --sport:#F2A93B; --sport-soft:#FBEBCC;
  }
  body.theme-vital, body.theme-vital input, body.theme-vital select, body.theme-vital button{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  body.theme-vital header h1, body.theme-vital .section-title,
  body.theme-vital .meal-head h3, body.theme-vital .sheet-titel,
  body.theme-vital .ringnum, body.theme-vital .haus-zahl,
  body.theme-vital .b-label{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    font-weight:700; letter-spacing:-0.01em;
  }
  body.theme-vital .card{ border-radius:20px; box-shadow:0 8px 24px rgba(0,0,0,.05); }
  body.theme-vital .tab{ border-radius:14px 14px 0 0; }
  body.theme-vital .ring-fg{ stroke-linecap:round; }
  body.theme-vital .badge, body.theme-vital .punkte-badge{ border-radius:10px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Punktekonto</h1>
    <p>Essen erfassen, Punkte im Blick behalten.</p>
    <div class="divider">· · · · ·</div>
  </header>

  <div class="people" id="people"></div>

  <div class="tabs" id="tabsBar"></div>
  <div class="card" id="view"><p class="muted">Lädt…</p></div>

  <a class="backlink" href="index.html">← Zurück zu Happy Cornelius</a>
</div>
<div id="toast"></div>

<script>
/* ============================================================
   Punktekonto – zweite App im Repo skufab/Vorratskammer
   Nutzt dieselbe Supabase-storage-Tabelle wie Happy Cornelius.
   Eigene Daten liegen unter Keys mit Präfix "punkte:".
   Rezepte und Wochenplan werden nur GELESEN, nie verändert.
   ============================================================ */

const SUPABASE_URL = 'https://wqmdjrczvirpmpcyavvs.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndxbWRqcmN6dmlycG1wY3lhdnZzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM2Mzg5NDgsImV4cCI6MjA5OTIxNDk0OH0.jKm3LYqLZoJfvLPKsFm2_L0x94Yfim6f96vqFYnz7K0';

/* defaultPin: SHA-256 von "<id>::<code>". Der Code steht bewusst nicht im Klartext hier,
   weil das Repo öffentlich ist. Wirklich sicher ist das trotzdem nicht – siehe Profil-Tab. */
const PEOPLE = [
  {id:'fabian', name:'Fabian',   recipes:true,  theme:null,        defaultPin:'695b37fc7bd3d1ea878f4731388c1a9345e8fc3e2c3507c003037007cd9641ba'},
  {id:'elena',  name:'Elena',    recipes:true,  theme:null,        defaultPin:'9bfcf1fede74bcdfc551a12d912f7d21e9aad46b293a82fe12946bcad18c0936'},
  {id:'mama',   name:'Oma Gigi', recipes:false, theme:null,        defaultPin:'a909965db62eebfc1435ef3cba7d3485becac0fd7db5c52fab379af1f1a6cd96'}
];
const RECENT_MAX = 20;
const WEEKDAYS = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const INTENSITY = [
  {id:'leicht', label:'Leicht',  hint:'Spaziergang, lockeres Rad fahren', perMin:0.133},
  {id:'mittel', label:'Mittel',  hint:'zügiges Training, Schwimmen',      perMin:0.233},
  {id:'hoch',   label:'Hoch',    hint:'Fitnessstudio, Joggen, intensiv',  perMin:0.333}
];
function sportPoints(minutes, intensityId){
  const lvl = INTENSITY.find(i=> i.id===intensityId) || INTENSITY[0];
  return Math.max(0, Math.round((Number(minutes)||0) * lvl.perMin));
}
/* Montag der aktuellen Woche, als Schlüssel fürs Wochenkonto */
function mondayIso(){
  const d = new Date();
  const day = d.getDay();
  d.setDate(d.getDate() + (day===0 ? -6 : 1-day));
  return isoDate(d);
}
function bankEarned(){ return (state.sportBank.entries||[]).reduce((s,e)=> s+e.points, 0); }
function bankRedeemed(){ return Object.values(state.sportBank.redeemed||{}).reduce((s,v)=> s+v, 0); }
function bankAvailable(){ return Math.max(0, bankEarned() - bankRedeemed()); }
function redeemedToday(){ return (state.sportBank.redeemed||{})[todayIso] || 0; }
/* Meilensteine sind einmalig erreicht und können nicht wieder verloren gehen. */
const MILESTONES = [
  {n:1,   icon:'🌱', label:'Angefangen',    note:'Der erste Eintrag ist der schwerste.'},
  {n:7,   icon:'🌿', label:'Eine Woche',    note:'Sieben Tage erfasst.'},
  {n:30,  icon:'🪴', label:'Ein Monat',     note:'Dreißig Tage zusammen.'},
  {n:100, icon:'🌳', label:'Hundert Tage',  note:'Daraus ist eine Gewohnheit geworden.'},
  {n:365, icon:'🏡', label:'Ein Jahr',      note:'Dreihundertfünfundsechzig Tage.'}
];
const MEALS = [
  {key:'breakfast', label:'Frühstück'},
  {key:'lunch',     label:'Mittagessen'},
  {key:'dinner',    label:'Abendessen'},
  {key:'snack',     label:'Snacks'}
];
const DEFAULT_BUDGET = 23;

let person = (function(){
  const stored = (localStorage.getItem('pk_person') || '').toLowerCase();
  // frühere Versionen haben den Anzeigenamen gespeichert – hier auf die Kennung umstellen
  const hit = PEOPLE.find(p=> p.id===stored || p.name.toLowerCase()===stored);
  return hit ? hit.id : 'fabian';
})();
function personName(){
  const p = PEOPLE.find(x=> x.id===person);
  return p ? p.name : person;
}
/* Nur Fabian und Elena sehen die Rezepte aus Happy Cornelius. */
function hasRecipes(){
  const p = PEOPLE.find(x=> x.id===person);
  return !!(p && p.recipes);
}
/* Vorlagen: Fabian und Elena teilen sich ihre, Oma Gigi sieht nur eigene. */
function visibleTemplates(){
  return state.templates.filter(t=>{
    if(!t) return false;
    const owner = t.owner || 'fabian';           // Vorlagen ohne Besitzer gelten als gemeinsam
    const ownerShares = PEOPLE.find(x=> x.id===owner);
    if(hasRecipes()) return !!(ownerShares && ownerShares.recipes);
    return owner === person;
  });
}
let activeTab = 'today';
let state = { day:{entries:[]}, weight:[], profile:{budget:DEFAULT_BUDGET}, recipes:[], templates:[], recent:[], log:[], house:null, sportBank:{entries:[],redeemed:{}}, myRecipeMeal:'lunch' };
let sheet = null;
let unlocked = false;   // gilt nur für die laufende Sitzung und nur für die gewählte Person

/* Der Code wird nie im Klartext gespeichert, sondern als Hash mit der Personenkennung
   als Salz. Wichtig: Das ist ein Sichtschutz im Haushalt, keine echte Zugangssperre –
   die Datenbank ist ohne Login erreichbar, wer den Link und etwas Wissen hat, kommt
   auch ohne Code an die Werte. */
function effectivePin(){
  if(state.profile.pinOff) return null;                 // bewusst abgeschaltet
  if(state.profile.pinHash) return state.profile.pinHash; // selbst gesetzter Code
  const p = PEOPLE.find(x=> x.id===person);
  return (p && p.defaultPin) || null;                   // Voreinstellung
}
async function hashCode(code){
  const data = new TextEncoder().encode(person + '::' + code);
  const buf = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(buf)).map(b=> b.toString(16).padStart(2,'0')).join('');
}

/* ---------- Datum ---------- */
function isoDate(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
const todayIso = isoDate(new Date());

/* ---------- Storage ---------- */
async function loadKey(key, fallback){
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/storage?key=eq.${encodeURIComponent(key)}&select=value`, {
      headers:{ apikey:SUPABASE_ANON_KEY, Authorization:`Bearer ${SUPABASE_ANON_KEY}` }
    });
    if(!res.ok) return fallback;
    const data = await res.json();
    if(data && data.length>0 && data[0].value) return JSON.parse(data[0].value);
    return fallback;
  }catch(e){ console.error('Laden fehlgeschlagen', e); return fallback; }
}
async function saveKey(key, value, quiet){
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/storage`, {
      method:'POST',
      headers:{
        apikey:SUPABASE_ANON_KEY,
        Authorization:`Bearer ${SUPABASE_ANON_KEY}`,
        'Content-Type':'application/json',
        'Prefer':'resolution=merge-duplicates,return=minimal'
      },
      body: JSON.stringify({key:key, value:JSON.stringify(value), updated_at:new Date().toISOString()})
    });
    if(!res.ok) showToast('Speichern fehlgeschlagen – bitte Verbindung prüfen', true);
    else if(!quiet) showToast('Gespeichert ✓');
  }catch(e){
    console.error('Speichern fehlgeschlagen', e);

/* ---------- Punkteformel ----------
   Vollständig:  kcal/33 + gesFett/9 + Zucker/9 − Protein/10 − Ballaststoffe/12
   Bei Rezepten liegen nur kcal und Protein vor – die übrigen Terme sind dann 0.
------------------------------------ */
function points(n){
  const p = (Number(n.kcal)||0)/33
          + (Number(n.fatSat)||0)/9
          + (Number(n.sugar)||0)/9
          - (Number(n.protein)||0)/10
          - (Number(n.fiber)||0)/12;
  return Math.max(0, Math.round(p));
}
function scale(per100, gram){
  const f = (Number(gram)||0)/100;
  return {
    kcal:(per100.kcal||0)*f, fatSat:(per100.fatSat||0)*f, sugar:(per100.sugar||0)*f,
    protein:(per100.protein||0)*f, fiber:(per100.fiber||0)*f
  };
}
function formatDate(iso){
  const parts = String(iso).split('-');
  if(parts.length !== 3) return iso;
  return parts[2] + '.' + parts[1] + '.' + parts[0];
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/* Wiegetag: 0 = Sonntag … 6 = Samstag, null = keiner eingestellt */
function weighDay(){
  const d = state.profile.weighDay;
  return (typeof d === 'number' && d >= 0 && d <= 6) ? d : null;
}
function isWeighDayToday(){
  const d = weighDay();
  return d !== null && new Date().getDay() === d;
}
function nextWeighDate(){
  const d = weighDay();
  if(d === null) return null;
  const now = new Date();
  let diff = (d - now.getDay() + 7) % 7;
  if(diff === 0) diff = 7;
  return shiftDate(todayIso, diff);
}
function weighedToday(){
  return (state.weight||[]).some(w=> w.date === todayIso);
}

function shiftDate(iso, days){
  const d = new Date(iso + 'T12:00:00');
  d.setDate(d.getDate() + days);
  return isoDate(d);
}

/* Serie: aufeinanderfolgende Tage mit mindestens einem Eintrag.
   Sie reisst erst, wenn ein ganzer Tag ausgelassen wurde – heute noch nichts
   erfasst zu haben beendet sie also nicht sofort. */
function computeStreak(log){
  const set = new Set(log || state.log || []);
  let cursor = todayIso;
  if(!set.has(cursor)) cursor = shiftDate(todayIso, -1);
  let n = 0;
  while(set.has(cursor)){ n++; cursor = shiftDate(cursor, -1); }
  return n;
}

/* Wie viele der letzten sieben Tage wurden erfasst */
function loggedThisWeek(log){
  const set = new Set(log || state.log || []);
  let n = 0;
  for(let i=0;i<7;i++){ if(set.has(shiftDate(todayIso, -i))) n++; }
  return n;
}

async function removeSport(id){
  const e = state.sportBank.entries.find(x=> x.id===id);
  state.sportBank.entries = state.sportBank.entries.filter(x=> x.id!==id);
  // Bereits eingelöste Punkte, die durch das Löschen nicht mehr gedeckt sind, zurücknehmen
  if(e){
    let over = bankRedeemed() - bankEarned();
    while(over > 0){
      const days = Object.keys(state.sportBank.redeemed).sort().reverse();
      const d = days.find(x=> state.sportBank.redeemed[x] > 0);
      if(!d) break;
      const cut = Math.min(over, state.sportBank.redeemed[d]);
      state.sportBank.redeemed[d] -= cut;
      if(state.sportBank.redeemed[d] <= 0) delete state.sportBank.redeemed[d];
      over -= cut;
    }
  }
  await saveKey(sportBankKey(), state.sportBank);
  render();
}

  state.sportBank.redeemed[todayIso] = (state.sportBank.redeemed[todayIso]||0) + n;

      <circle class="ring-fg ${over?'over':''}" cx="98" cy="98" r="${r}"
        stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c*(1-frac)).toFixed(1)}"></circle>
    </svg>
    <div class="ringmid">

      <span class="ringsub">von ${budget} Punkten</span>
    </div>
  </div>`;
}

/* Veraenderung zum Wert, der einer Woche zuvor am naechsten liegt */
function weekChange(){
  const list = (state.weight||[]).slice().sort((a,b)=> a.date<b.date?-1:1);
  if(list.length < 2) return null;
  const latest = list[list.length-1];
  const target = shiftDate(latest.date, -7);
  let best = null, bestDiff = Infinity;
  for(let i=0;i<list.length-1;i++){
    const days = Math.abs((new Date(list[i].date+'T12:00:00') - new Date(target+'T12:00:00')) / 86400000);
    if(days < bestDiff){ bestDiff = days; best = list[i]; }
  }
  if(!best || bestDiff > 4) return null;   // ohne halbwegs passenden Vergleichswert lieber nichts zeigen
  const d = latest.kg - best.kg;
  return { sign: d>0?'+':(d<0?'−':'±'), value: Math.abs(d).toFixed(1), from: best.date };
}

      return x.toFixed(1)+','+y.toFixed(1);
    });
    html += `<svg viewBox="0 0 300 130" class="chart">
      <polyline points="${pts.join(' ')}"></polyline>
      ${pts.map(p=>{const [x,y]=p.split(','); return `<circle cx="${x}" cy="${y}" r="3.5"></circle>`;}).join('')}
    </svg>`;
    const diff = vals[vals.length-1]-vals[0];
    html += `<p class="muted" style="margin-top:6px">${diff>0?'+':''}${diff.toFixed(1)} kg über die letzten ${list.length} Einträge</p>`;
  } else if(list.length===1){
    html += `<p class="muted">Aktuell ${list[0].kg.toFixed(1)} kg. Ab dem zweiten Eintrag siehst du hier den Verlauf.</p>`;
  } else {
    html += `<p class="muted">Noch kein Gewicht erfasst.</p>`;
  }

  const all = state.weight;
  if(all.length){
    html += `<h3 class="section-title" style="font-size:1rem;margin:20px 0 4px">Alle Einträge</h3>`;
    html += `<ul class="items">` + all.slice().reverse().map((w, i, arr)=>{
      const prev = arr[i+1];                       // arr ist absteigend, also ist i+1 der ältere Wert
      let delta = '';
      if(prev){
        const d = w.kg - prev.kg;
        if(Math.abs(d) >= 0.05) delta = ' · ' + (d>0?'+':'−') + Math.abs(d).toFixed(1) + ' kg';
      }
      return `<li>
        <div class="it-txt">
          <span class="it-name">${w.kg.toFixed(1)} kg</span>
          <span class="it-meta">${esc(formatDate(w.date))}${esc(delta)}</span>
        </div>
        <button class="del" data-wdel="${esc(w.date)}" aria-label="Eintrag vom ${esc(w.date)} löschen">×</button>
      </li>`;
    }).join('') + `</ul>`;
  }
  return html;
}

function milestonesFor(total){
  return MILESTONES.map(m=> Object.assign({}, m, {done: total >= m.n}));
}

function viewHouse(){
  if(!state.house){
    return `<h2 class="section-title">Unser Haus</h2><p class="muted">Lädt…</p>`;
  }

  const rows = PEOPLE.map(p=>{
    const log = state.house[p.id] || [];
    return {
      id:p.id, name:p.name,
      total: log.length,
      week: loggedThisWeek(log),
      streak: computeStreak(log),
      days: Array.from({length:7}, (_,i)=> log.indexOf(shiftDate(todayIso, -(6-i))) !== -1)
    };
  });

  const gesamtWoche = rows.reduce((s,r)=> s+r.week, 0);
  const gesamtTage  = rows.reduce((s,r)=> s+r.total, 0);
  const alleHeute   = rows.every(r=> r.days[6]);

  let html = `<h2 class="section-title">Unser Haus</h2>`;

  html += `<div class="hausbox">
    <span class="haus-zahl">${gesamtWoche}<span class="haus-von">/21</span></span>
    <span class="haus-label">Einträge diese Woche, zusammen</span>
    ${alleHeute ? `<span class="haus-jubel">Heute haben alle drei etwas eingetragen 🎉</span>` : ''}
  </div>`;

  html += `<ul class="items" style="margin-top:16px">` + rows.map(r=>`
    <li style="align-items:flex-start">
      <div class="it-txt">
        <span class="it-name">${esc(r.name)}</span>
        <span class="punkte-woche">${r.days.map(d=> `<i class="${d?'an':''}"></i>`).join('')}</span>
      </div>
      <span class="it-meta" style="text-align:right;white-space:nowrap">
        ${r.streak? r.streak+' 🔥':'—'}<br>${r.total} Tage
      </span>
    </li>`).join('') + `</ul>`;
  html += `<p class="muted" style="margin-top:6px">Die letzten sieben Tage, älteste links. Kein Wettbewerb – nur damit ihr seht, dass ihr nicht allein dran seid.</p>`;

  /* Meilensteine des Hauses, gemeinsam gerechnet */
  html += `<h3 class="section-title" style="font-size:1rem;margin:24px 0 4px">Gemeinsame Meilensteine</h3>
    <p class="muted" style="margin:0 0 10px">${gesamtTage} erfasste Tage von euch dreien zusammen.</p>`;
  html += `<div class="badges">` + milestonesFor(gesamtTage).map(m=>`
    <div class="badge-k ${m.done?'done':''}">
      <span class="b-icon">${m.done? m.icon : '🔒'}</span>
      <span class="b-label">${esc(m.label)}</span>
      <span class="b-note">${m.done? esc(m.note) : 'ab '+m.n+' Tagen'}</span>
    </div>`).join('') + `</div>`;

  /* Rezepte vervollstaendigen – eine gemeinsame Aufgabe mit sichtbarem Fortschritt */
  const rez = state.recipes.filter(r=> r && r.title);
  if(rez.length){
    const mit = rez.filter(r=> Number(r.calories) > 0).length;
    const pct = Math.round(mit / rez.length * 100);
    html += `<h3 class="section-title" style="font-size:1rem;margin:24px 0 4px">Rezepte mit Nährwerten</h3>
      <div class="balken"><span style="width:${pct}%"></span></div>
      <p class="muted" style="margin-top:6px">${mit} von ${rez.length} Rezepten haben Kalorien hinterlegt (${pct} %).
      ${pct===100 ? 'Vollständig – stark! 🌟' : 'Jedes ergänzte Rezept macht das Eintragen für alle leichter.'}</p>`;
  }

  return html;
}

/* Rezepte-Schnellzugriff: Mahlzeit einmal wählen, danach jedes Rezept mit einem Tap eintragen. */

  const mine = visibleTemplates();

    tpl += `<ul class="items">` + mine.map(t=>{
      const label = (MEALS.find(m=>m.key===t.meal)||{}).label || '';
      return `<li>
        <div class="it-txt">
          <span class="it-name">☆ ${esc(t.name)}</span>
          <span class="it-meta">${esc(label)} · ${t.items.length} Positionen</span>
        </div>
        <span class="it-pts">${templatePoints(t)}</span>
        <button class="del" data-tpl-del="${esc(t.id)}" aria-label="Vorlage löschen">×</button>
      </li>`;
    }).join('') + `</ul>`;
  } else {
    tpl += `<p class="muted">Noch keine Vorlagen. Erfasse eine Mahlzeit und tippe darunter auf „☆ Als Vorlage".</p>`;
  }
  tpl += hasRecipes()
    ? `<p class="muted" style="margin-top:10px">Fabian und Elena teilen sich ihre Vorlagen. Oma Gigi sieht nur ihre eigenen.</p>`
    : `<p class="muted" style="margin-top:10px">Diese Mahlzeiten sind nur für dich – die anderen sehen sie nicht.</p>`;

  const wd = weighDay();
  let tag = `<h3 class="section-title" style="font-size:1rem;margin:22px 0 8px">Wiegetag</h3>
    <div class="field">
      <select id="wdSel">
        <option value="">Kein fester Tag</option>
        ${WEEKDAYS.map((n,i)=> `<option value="${i}" ${wd===i?'selected':''}>${esc(n)}</option>`).join('')}
      </select>
    </div>
    <p class="muted">An diesem Tag erinnert dich die Tagesansicht ans Wiegen. Ein fester Rhythmus sagt mehr aus als tägliches Wiegen, weil Wasserhaushalt und Verdauung von Tag zu Tag stark schwanken.</p>`;

  const hasPin = !!effectivePin();
  const isDefault = !state.profile.pinHash && !state.profile.pinOff;
  tpl += `<h3 class="section-title" style="font-size:1rem;margin:22px 0 8px">Code für den Gewichtsbereich</h3>`;
  if(hasPin){
    tpl += `<p class="muted">Der Bereich ist geschützt.${isDefault?' Aktuell gilt der voreingestellte Code.':''}${unlocked?' In dieser Sitzung entsperrt.':''}</p>
      <div class="row" style="margin-top:8px;flex-wrap:wrap">
        <button class="action ghost small" id="pinChange">Code ändern</button>
        <button class="action ghost small" id="pinRemove">Schutz aufheben</button>
      </div>`;
  } else {
    tpl += `<p class="muted">Ohne Code ist der Gewichtsbereich für jeden sichtbar, der das Gerät in der Hand hat.</p>

  }
  tpl += `<p class="muted" style="margin-top:8px">Sichtschutz im Haushalt, keine echte Zugangssperre – die Datenbank selbst hat keinen Login.</p>`;
  if(isDefault) tpl += `<p class="muted" style="color:var(--warn);margin-top:6px">Der voreingestellte Code ist ein Geburtsdatum und damit für Familie leicht zu erraten. Für echten Schutz einen eigenen Code festlegen.</p>`;

  tpl += `<h3 class="section-title" style="font-size:1rem;margin:22px 0 8px">Zuletzt verwendet</h3>`;
  if((state.recent||[]).length){

  } else {

      Jede Person hat eigene Einträge. Sie liegen in derselben Datenbank wie Happy Cornelius,

function render(){
  applyTheme();
  renderPeople();
  renderTabs();
  const view = document.getElementById('view');
  if(activeTab==='today')          view.innerHTML = viewToday();
  else if(activeTab==='weight')    view.innerHTML = viewWeight();
  else if(activeTab==='house')     view.innerHTML = viewHouse();
  else if(activeTab==='analysis')  view.innerHTML = viewAnalysis();
  else if(activeTab==='myrecipes') view.innerHTML = viewMyRecipes();
  else                             view.innerHTML = viewProfile();
  bind();
}

function bind(){
  document.querySelectorAll('[data-add]').forEach(el=>{
    el.onclick = ()=> openSheet(el.dataset.add);
  });
  document.querySelectorAll('[data-del]').forEach(el=>{
    el.onclick = ()=> removeEntry(el.dataset.del);
  });
  document.querySelectorAll('[data-sdel]').forEach(el=>{
    el.onclick = ()=> removeSport(el.dataset.sdel);
  });
  const spAdd = document.getElementById('sportAdd');
  if(spAdd) spAdd.onclick = openSportSheet;
  const spRedeemBtn = document.getElementById('spRedeemBtn');
  if(spRedeemBtn) spRedeemBtn.onclick = ()=> redeemSport(document.getElementById('spRedeem').value);
  document.querySelectorAll('[data-tpl-save]').forEach(el=>{
    el.onclick = ()=>{
      const mealKey = el.dataset.tplSave;
      const label = (MEALS.find(m=>m.key===mealKey)||{}).label || '';
      askName('Vorlage aus ' + label, 'z. B. Frühstückstoast', n=> saveTemplate(n, mealKey));
    };
  });
  document.querySelectorAll('[data-tpl-del]').forEach(el=>{
    el.onclick = ()=>{
      const id = el.dataset.tplDel;
      const t = state.templates.find(x=> String(x.id)===String(id));
      askConfirm('Vorlage löschen?', (t? '„'+t.name+'"' : 'Die Vorlage') + ' wird entfernt.', 'Löschen', ()=> deleteTemplate(id));
    };
  });
  document.querySelectorAll('[data-portions]').forEach(el=>{
    el.onchange = ()=> setPortions(el.dataset.portions, el.value);
  });

  document.querySelectorAll('[data-wdel]').forEach(el=>{
    el.onclick = ()=>{
      const date = el.dataset.wdel;
      const w = state.weight.find(x=> x.date===date);
      askConfirm(
        'Eintrag löschen?',
        (w ? w.kg.toFixed(1) + ' kg vom ' + formatDate(date) : formatDate(date)) + ' wird entfernt. Das lässt sich nicht rückgängig machen.',
        'Löschen',
        ()=> deleteWeight(date)
      );
    };
  });

  const ws = document.getElementById('wSave');
  if(ws) ws.onclick = ()=>{
    const dEl = document.getElementById('wDate');
    addWeight(document.getElementById('wInput').value, dEl ? dEl.value : todayIso);
  };
  const bs = document.getElementById('bSave');
  if(bs) bs.onclick = ()=> setBudget(document.getElementById('bInput').value);
  const mrMeal = document.getElementById('mrMeal');
  if(mrMeal) mrMeal.onchange = ()=>{ state.myRecipeMeal = mrMeal.value; };
  document.querySelectorAll('[data-quickadd]').forEach(el=>{
    el.onclick = async ()=>{
      const r = state.recipes.find(x=> String(x.id)===el.dataset.quickadd);
      if(!r) return;
      await addEntry({
        meal: state.myRecipeMeal || 'lunch', name:r.title, recipeId:r.id, portions:1,
        kcal:Number(r.calories)||0, protein:Number(r.protein)||0, fatSat:0, sugar:0, fiber:0, source:'recipe'
      });
      showToast('„' + r.title + '" hinzugefügt ✓');
    };
  });

  const wdSel = document.getElementById('wdSel');
  if(wdSel) wdSel.onchange = ()=> setWeighDay(wdSel.value);

  const rc = document.getElementById('recClear');
  if(rc) rc.onclick = ()=> askConfirm('Liste leeren?', 'Alle zuletzt verwendeten Einträge werden entfernt.', 'Leeren', clearRecent);

  const pinGo = document.getElementById('pinGo');
  const pinIn = document.getElementById('pinIn');
  if(pinGo) pinGo.onclick = ()=> tryUnlock((pinIn.value||'').trim());
  if(pinIn){
    pinIn.focus();
    pinIn.onkeydown = (e)=>{ if(e.key==='Enter') tryUnlock((pinIn.value||'').trim()); };
  }

  const askPin = (title)=> askName(title, 'Zahlencode', c=>{
    if(c.length < 4){ showToast('Bitte mindestens vier Zeichen', true); return; }
    setPin(c);
  });
  const pinSet = document.getElementById('pinSet');
  if(pinSet) pinSet.onclick = ()=> askPin('Code festlegen');
  const pinChange = document.getElementById('pinChange');
  if(pinChange) pinChange.onclick = ()=> askPin('Neuen Code festlegen');
  const pinRemove = document.getElementById('pinRemove');
  if(pinRemove) pinRemove.onclick = removePin;
}

/* ---------- Namensdialog ---------- */
function askName(title, placeholder, cb){
  const o = document.createElement('div');
  o.className = 'overlay';
  o.onclick = (ev)=>{ if(ev.target===o) o.remove(); };
  o.innerHTML = `<div class="sheet">
    <div class="grip"></div>
    <h3>${esc(title)}</h3>
    <div class="field"><input id="nameIn" placeholder="${esc(placeholder)}" autocomplete="off"></div>
    <div class="row">
      <button class="action pk" id="nameOk" style="flex:1;padding:12px">Speichern</button>
      <button class="action ghost" id="nameNo" style="flex:none;padding:12px">Abbrechen</button>
    </div>
  </div>`;
  document.body.appendChild(o);
  const inp = o.querySelector('#nameIn');
  inp.focus();
  const done = ()=>{
    const v = (inp.value||'').trim();
    if(!v){ showToast('Bitte einen Namen eingeben', true); return; }
    o.remove(); cb(v);
  };
  o.querySelector('#nameOk').onclick = done;
  o.querySelector('#nameNo').onclick = ()=> o.remove();
  inp.onkeydown = (e)=>{ if(e.key==='Enter') done(); };
}

/* ---------- Sport-Dialog ---------- */
function openSportSheet(){
  const o = document.createElement('div');
  o.className = 'overlay';
  o.onclick = (ev)=>{ if(ev.target===o) o.remove(); };
  const chips = INTENSITY.map((lvl,i)=>
    `<button type="button" class="intensity-chip ${i===1?'active':''}" data-lvl="${lvl.id}">
      <b>${esc(lvl.label)}</b><span>${esc(lvl.hint)}</span>
    </button>`
  ).join('');
  o.innerHTML = `<div class="sheet">
    <div class="grip"></div>
    <h3>Bewegung eintragen</h3>
    <div class="field"><label>Was hast du gemacht?</label><input id="spName" placeholder="z. B. Fitnessstudio, Spazieren, Tennis"></div>
    <div class="field">
      <label>Intensität – wie du sie selbst einschätzt</label>
      <div class="intensity-row">${chips}</div>
    </div>
    <div class="field"><label>Dauer in Minuten</label><input id="spMin" type="number" min="1" step="5" value="30"></div>
    <div class="preview"><b id="spPts">0</b><span>Punkte ins Wochenkonto</span></div>
    <button class="action pk" id="spSave" style="width:100%;padding:13px;margin-top:16px">Eintragen</button>
    <p class="muted" style="margin-top:10px">Grobe Schätzung, keine Sportuhr-Genauigkeit – du schätzt die Intensität selbst ein.</p>
  </div>`;
  document.body.appendChild(o);

  const min = o.querySelector('#spMin');
  const ptsEl = o.querySelector('#spPts');
  const chipEls = Array.from(o.querySelectorAll('.intensity-chip'));
  let level = INTENSITY[1].id;

  function refresh(){
    ptsEl.textContent = sportPoints(min.value, level);
  }
  chipEls.forEach(ch=>{
    ch.onclick = ()=>{
      level = ch.dataset.lvl;
      chipEls.forEach(c=> c.classList.toggle('active', c===ch));
      refresh();
    };
  });
  min.oninput = refresh;
  refresh();

  o.querySelector('#spSave').onclick = async ()=>{
    const name = (o.querySelector('#spName').value||'').trim() || 'Bewegung';
    const minutes = min.value;
    o.remove();
    await addSport(name, minutes, level);
  };
}

/* ---------- Eingabe-Sheet ---------- */
function openSheet(mealKey){
  sheet = { meal:mealKey, query:'', off:[], picked:null, amount:1, loading:false, error:'', scanning:false, scanMsg:'' };
  renderSheet();
}
function closeSheet(){
  stopScanner();
  sheet = null;
  const o = document.getElementById('overlay');
  if(o) o.remove();
}

/* Eure Rezepte lokal filtern – ohne Netz, direkt beim Tippen */
function recipeHits(){
  const q = (sheet.query||'').trim().toLowerCase();
  const list = state.recipes.filter(r=> r && r.title);
  if(!q) return list.slice(0,8);
  return list.filter(r=>
    r.title.toLowerCase().includes(q) ||
    String(r.category||'').toLowerCase().includes(q)
  ).slice(0,12);
}

/* Zuletzt verwendete Produkte filtern */
function recentHits(){
  const q = (sheet.query||'').trim().toLowerCase();
  let list = (state.recent||[]).filter(r=> r && r.name);
  if(q) list = list.filter(r=> r.name.toLowerCase().includes(q));
  return list.slice(0, RECENT_MAX);
}

/* Vorlagen filtern: passende Mahlzeit zuerst, Suchbegriff beruecksichtigen */
function templateHits(){
  const q = (sheet.query||'').trim().toLowerCase();
  let list = visibleTemplates().filter(t=> t && t.name);
  if(q) list = list.filter(t=> t.name.toLowerCase().includes(q));
  // Vorlagen der aktuellen Mahlzeit nach oben
  return list.sort((a,b)=>{
    const am = a.meal===sheet.meal ? 0 : 1;
    const bm = b.meal===sheet.meal ? 0 : 1;
    if(am!==bm) return am-bm;
    return String(a.name).localeCompare(String(b.name),'de');
  }).slice(0,8);
}

/* Alle Rezepte als Dropdown, nach Kategorie gruppiert und alphabetisch sortiert */
function recipeSelect(){
  const list = state.recipes.filter(r=> r && r.title);
  if(!list.length) return `<select id="rSelect" disabled><option>Noch keine Rezepte angelegt</option></select>`;
  const groups = {};
  list.forEach(r=>{
    const cat = (r.category||'').trim() || 'Ohne Kategorie';
    (groups[cat] = groups[cat] || []).push(r);
  });
  const cats = Object.keys(groups).sort((a,b)=> a.localeCompare(b,'de'));
  let html = `<select id="rSelect"><option value="">– Rezept wählen –</option>`;
  cats.forEach(cat=>{
    html += `<optgroup label="${esc(cat)}">`;
    groups[cat].sort((a,b)=> String(a.title).localeCompare(String(b.title),'de')).forEach(r=>{
      const kcal = r.calories ? ' ('+r.calories+' kcal)' : ' (ohne Nährwerte)';
      html += `<option value="${esc(r.id)}">${esc(r.title)}${esc(kcal)}</option>`;
    });
    html += `</optgroup>`;
  });
  return html + `</select>`;
}

/* Nährwerte je nach Quelle: Rezept rechnet in Portionen, Produkt in Gramm */
function nutrientsFor(picked, amount){
  if(picked.kind==='fixed'){
    const f = Number(amount)||0;
    return {kcal:(picked.kcal||0)*f, protein:(picked.protein||0)*f, fatSat:0, sugar:0, fiber:0};
  }
  if(picked.kind==='recipe'){
    const f = Number(amount)||0;
    return {
      kcal:(Number(picked.recipe.calories)||0)*f,
      protein:(Number(picked.recipe.protein)||0)*f,
      fatSat:0, sugar:0, fiber:0
    };
  }
  return scale(picked.per100, amount);
}

function renderSheet(){
  let o = document.getElementById('overlay');
  if(!o){
    o = document.createElement('div');
    o.id = 'overlay'; o.className = 'overlay';
    o.onclick = (ev)=>{ if(ev.target===o) closeSheet(); };
    document.body.appendChild(o);
  }
  const label = (MEALS.find(m=>m.key===sheet.meal)||{}).label || '';
  let inner = `<div class="grip"></div>`;

  if(!sheet.picked){
    const withRecipes = hasRecipes();
    inner += `<p class="stepper">Schritt 1 von 2 · Auswahl</p>
      <h3>${esc(label)} – was gab es?</h3>
      <input id="q" placeholder="${withRecipes?'Rezept oder Lebensmittel suchen':'Lebensmittel suchen'}" value="${esc(sheet.query||'')}" autocomplete="off">
      <div class="row" style="margin-top:10px;flex-wrap:wrap">
        <button class="action pk small" id="offBtn" ${sheet.loading||!(sheet.query||'').trim()?'disabled':''}>
          ${sheet.loading?'Sucht…':'In der Datenbank suchen'}
        </button>
        <button class="action ghost small" id="scanBtn">📷 Barcode scannen</button>
      </div>`;

    /* Treffer aus dem Verzeichnis stehen direkt unter der Suche */
    if(sheet.off.length){
      inner += `<div class="grouphead">Gefundene Produkte</div>`;
      inner += `<ul class="results">` + sheet.off.map((r,i)=>
        `<li><button data-off="${i}">
          <span class="r-name">${esc(r.name)}</span>
          <span class="r-meta">${r.brand?esc(r.brand)+' · ':''}${Math.round(r.per100.kcal)} kcal / 100 g</span>
        </button></li>`
      ).join('') + `</ul>`;
    }
    if(sheet.error) inner += `<p class="muted" style="color:var(--warn);margin:8px 0 0">${esc(sheet.error)}</p>`;

    /* Zuletzt verwendet – für Oma Gigi der wichtigste Block, daher weit oben */
    const rec = recentHits();
    if(rec.length){
      inner += `<div class="grouphead">Zuletzt verwendet</div>`;
      inner += `<ul class="results">` + rec.map((r,i)=>{
        const meta = r.kind==='off'
          ? Math.round(r.per100.kcal)+' kcal / 100 g'
          : Math.round(r.kcal||0)+' kcal';
        return `<li><button data-recent="${i}">
          <span class="r-name">↻ ${esc(r.name)}</span>
          <span class="r-meta">${esc(meta)}</span>
        </button></li>`;
      }).join('') + `</ul>`;
    } else if(!withRecipes){
      inner += `<div class="grouphead">Zuletzt verwendet</div>
        <p class="muted" style="margin:8px 0 0">Hier sammeln sich die Sachen, die du eingetragen hast – dann brauchst du sie nicht jedes Mal neu zu suchen.</p>`;
    }

    /* Rezepte nur für Fabian und Elena */
    if(withRecipes){
      const hits = recipeHits();
      inner += `<div class="grouphead">Aus euren Rezepten</div>
        <div class="field" style="margin:8px 0 0">${recipeSelect()}</div>`;
      if(hits.length){
        inner += `<ul class="results">` + hits.map(r=>{
          const meta = [];
          if(r.calories) meta.push(r.calories+' kcal');
          if(r.protein)  meta.push(r.protein+' g P');
          meta.push('pro Portion');
          return `<li><button data-recipe="${esc(r.id)}">
            <span class="r-name">📖 ${esc(r.title)}${(!r.calories&&!r.protein)?' ⚠️':''}</span>
            <span class="r-meta">${esc(meta.join(' · '))}</span>
          </button></li>`;
        }).join('') + `</ul>`;
      } else {
        inner += `<p class="muted" style="margin:8px 0 0">Kein Rezept passt dazu.</p>`;
      }
    }

    /* Eigene Mahlzeiten und Freitext ganz unten */
    const tpls = templateHits();
    inner += `<div class="grouphead">${withRecipes?'Gespeicherte Mahlzeiten':'Deine Mahlzeiten'}</div>`;
    if(tpls.length){
      inner += `<ul class="results">` + tpls.map(t=>
        `<li><button data-tpl="${esc(t.id)}">
          <span class="r-name">☆ ${esc(t.name)}</span>
          <span class="r-meta">${t.items.length} Positionen · ${templatePoints(t)} Punkte</span>
        </button></li>`
      ).join('') + `</ul>`;
    } else {
      inner += `<p class="muted" style="margin:8px 0 0">Noch keine gespeichert. Trag eine Mahlzeit ein und tippe darunter auf „☆ Als Vorlage".</p>`;
    }
    inner += `<button class="action ghost small" id="freeBtn" style="margin-top:12px">Eigener Eintrag</button>`;

  } else if(sheet.picked === 'scan'){
    inner += `<h3>Barcode scannen</h3>
      <div id="reader" style="width:100%;border-radius:14px;overflow:hidden;background:#000;min-height:220px"></div>
      <p class="muted" id="scanMsg" style="margin-top:10px">${esc(sheet.scanMsg||'Kamera wird gestartet…')}</p>
      <button class="action ghost small" id="scanStop" style="margin-top:10px">Abbrechen</button>`;

  } else if(sheet.picked === 'free'){
    inner += `<h3>${esc(label)} – eigener Eintrag</h3>
      <div class="field"><label>Bezeichnung</label><input id="fName" placeholder="z. B. Reste von gestern"></div>
      <div class="field"><label>Kalorien</label><input id="fKcal" type="number" min="0" placeholder="z. B. 420"></div>
      <div class="field"><label>Protein in g (optional)</label><input id="fProt" type="number" min="0" placeholder="z. B. 25"></div>
      <button class="action pk" id="freeSave" style="width:100%;padding:13px">Eintragen</button>
      <button class="action ghost small" id="backBtn" style="margin-top:10px">← Zurück</button>`;

  } else {
    const kind = sheet.picked.kind;
    const n = nutrientsFor(sheet.picked, sheet.amount);
    const name = kind==='recipe' ? sheet.picked.recipe.title : sheet.picked.name;
    const unitLabel = kind==='off' ? 'Menge in Gramm' : (kind==='recipe' ? 'Portionen' : 'Anzahl');
    const icon = kind==='recipe' ? '📖 ' : '';
    inner += `<button class="action ghost small" id="backBtn" style="margin-bottom:10px">← Andere Auswahl</button>
      <p class="stepper">Schritt 2 von 2 · Menge</p>
      <h3>${icon}${esc(name)}</h3>
      <div class="field">
        <label>${unitLabel}</label>
        <input id="aInput" type="number" min="${kind==='off'?'1':'0.5'}" step="${kind==='off'?'10':'0.5'}" value="${sheet.amount}">
      </div>
      <div class="preview"><b>${points(n)}</b><span>Punkte</span></div>
      <p class="muted" id="aSub" style="text-align:center;margin:8px 0 0">
        ${Math.round(n.kcal)} kcal${n.protein?' · '+Math.round(n.protein)+' g Protein':''}
      </p>
      <button class="action pk" id="saveBtn" style="width:100%;padding:13px;margin-top:16px">Eintragen</button>`;
  }

  o.innerHTML = `<div class="sheet">${inner}</div>`;
  bindSheet();
}

function bindSheet(){
  const q = document.getElementById('q');
  if(q){
    q.oninput = ()=>{
      sheet.query = q.value;
      const pos = q.selectionStart;
      renderSheet();
      const q2 = document.getElementById('q');
      if(q2){ q2.focus(); q2.setSelectionRange(pos,pos); }
    };
    q.onkeydown = (e)=>{ if(e.key==='Enter') searchOFF(); };
  }
  const offBtn = document.getElementById('offBtn');
  if(offBtn) offBtn.onclick = searchOFF;

  function pickRecipe(id){
    const r = state.recipes.find(x=> String(x.id)===String(id));
    if(!r) return;
    sheet.picked = {kind:'recipe', recipe:r};
    sheet.amount = 1;
    renderSheet();
  }
  document.querySelectorAll('[data-recipe]').forEach(el=>{
    el.onclick = ()=> pickRecipe(el.dataset.recipe);
  });
  const rSel = document.getElementById('rSelect');
  if(rSel) rSel.onchange = ()=>{ if(rSel.value) pickRecipe(rSel.value); };

  document.querySelectorAll('[data-tpl]').forEach(el=>{
    el.onclick = async ()=>{
      const t = state.templates.find(x=> String(x.id)===String(el.dataset.tpl));
      if(!t) return;
      const meal = sheet.meal;
      closeSheet();
      await addEntries(t.items.map(it=> Object.assign({}, it, {meal:meal, source:'template'})));
      showToast('„' + t.name + '" eingetragen ✓');
    };
  });

  document.querySelectorAll('[data-recent]').forEach(el=>{
    el.onclick = ()=>{
      const r = recentHits()[Number(el.dataset.recent)];
      if(!r) return;
      if(r.kind==='off'){
        sheet.picked = {kind:'off', name:r.name, brand:r.brand||'', per100:r.per100};
        sheet.amount = r.amount || 100;
      } else {
        sheet.picked = {kind:'fixed', name:r.name, kcal:r.kcal||0, protein:r.protein||0};
        sheet.amount = 1;
      }
      renderSheet();
    };
  });

  const scanBtn = document.getElementById('scanBtn');
  if(scanBtn) scanBtn.onclick = ()=>{ sheet.picked = 'scan'; sheet.scanMsg = 'Kamera wird gestartet…'; renderSheet(); startScanner(); };
  const scanStop = document.getElementById('scanStop');
  if(scanStop) scanStop.onclick = ()=>{ stopScanner(); sheet.picked = null; renderSheet(); };
  document.querySelectorAll('[data-off]').forEach(el=>{
    el.onclick = ()=>{
      sheet.picked = Object.assign({kind:'off'}, sheet.off[Number(el.dataset.off)]);
      sheet.amount = 100;
      renderSheet();
    };
  });

  const back = document.getElementById('backBtn');
  if(back) back.onclick = ()=>{ stopScanner(); sheet.picked = null; renderSheet(); };
  const free = document.getElementById('freeBtn');
  if(free) free.onclick = ()=>{ sheet.picked = 'free'; renderSheet(); };

  const a = document.getElementById('aInput');
  if(a) a.oninput = ()=>{
    sheet.amount = Number(a.value)||0;
    const n = nutrientsFor(sheet.picked, sheet.amount);
    const pv = document.querySelector('.preview b');
    if(pv) pv.textContent = points(n);
    const sub = document.getElementById('aSub');
    if(sub) sub.textContent = Math.round(n.kcal)+' kcal' + (n.protein?' · '+Math.round(n.protein)+' g Protein':'');
  };

  const save = document.getElementById('saveBtn');
  if(save) save.onclick = async ()=>{
    const picked = sheet.picked;
    const kind = picked.kind;
    const amount = sheet.amount;
    const n = nutrientsFor(picked, amount);
    const entry = Object.assign({
      meal: sheet.meal,
      name: kind==='recipe' ? picked.recipe.title : picked.name
    }, n);
    if(kind==='recipe'){ entry.recipeId = picked.recipe.id; entry.portions = amount; entry.source='recipe'; }
    else if(kind==='off'){ entry.grams = amount; }
    else { entry.count = amount; }
    closeSheet();
    await addEntry(entry);
    // Rezepte stehen ohnehin in der Liste – nur Produkte und Eigenes in den Verlauf
    if(kind==='off'){
      await pushRecent({kind:'off', name:picked.name, brand:picked.brand||'', per100:picked.per100, amount:amount});
    } else if(kind==='fixed'){
      await pushRecent({kind:'fixed', name:picked.name, kcal:picked.kcal, protein:picked.protein});
    }
  };

  const fs = document.getElementById('freeSave');
  if(fs) fs.onclick = async ()=>{
    const name = (document.getElementById('fName').value||'').trim();
    const kcal = Number(document.getElementById('fKcal').value)||0;
    const prot = Number(document.getElementById('fProt').value)||0;
    if(!name){ showToast('Bitte eine Bezeichnung eingeben', true); return; }
    const meal = sheet.meal;
    closeSheet();
    await addEntry({meal, name, kcal, protein:prot, fatSat:0, sugar:0, fiber:0});
    await pushRecent({kind:'fixed', name:name, kcal:kcal, protein:prot});
  };
}

/* ---------- Barcode-Scanner ----------
   Nutzt html5-qrcode, das erst beim ersten Antippen nachgeladen wird.
   Kamera geht nur über HTTPS – bei GitHub Pages ist das gegeben.
------------------------------------------- */
const SCANNER_SRC = 'https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js';
let scanner = null;
let scannerLib = null;

function loadScannerLib(){
  if(scannerLib) return scannerLib;
  scannerLib = new Promise((resolve, reject)=>{
    if(window.Html5Qrcode) return resolve();
    const el = document.createElement('script');
    el.src = SCANNER_SRC;
    el.onload = ()=> resolve();
    el.onerror = ()=>{ scannerLib = null; reject(new Error('Scanner konnte nicht geladen werden')); };
    document.head.appendChild(el);
  });
  return scannerLib;
}

function setScanMsg(msg){
  if(sheet) sheet.scanMsg = msg;
  const el = document.getElementById('scanMsg');
  if(el) el.textContent = msg;
}

async function startScanner(){
  try{
    await loadScannerLib();
  }catch(e){
    setScanMsg('Scanner nicht verfügbar. Prüf die Internetverbindung oder such über den Namen.');
    return;
  }
  if(!document.getElementById('reader')) return;
  try{
    scanner = new window.Html5Qrcode('reader', { verbose:false });
    await scanner.start(
      { facingMode:'environment' },
      { fps:10, qrbox:{width:260, height:140} },
      (text)=>{ stopScanner(); lookupBarcode(text); },
      ()=>{}
    );
    setScanMsg('Barcode ins Bild halten.');
  }catch(e){
    console.error(e);
    setScanMsg('Kein Kamerazugriff. Erlaub den Zugriff in den Browser-Einstellungen und versuch es erneut.');
    scanner = null;
  }
}

function stopScanner(){
  if(!scanner) return;
  const sc = scanner;
  scanner = null;
  try{ sc.stop().then(()=> sc.clear()).catch(()=>{}); }catch(e){}
}

async function lookupBarcode(code){
  if(!sheet) return;
  sheet.picked = null;
  sheet.loading = true;
  sheet.error = '';
  renderSheet();
  try{
    const res = await fetch('https://world.openfoodfacts.org/api/v2/product/' + encodeURIComponent(code) + '.json');
    const data = await res.json();
    if(!data || data.status !== 1 || !data.product){
      sheet.loading = false;
      sheet.error = 'Barcode ' + code + ' ist nicht im Verzeichnis. Trag das Produkt als eigenen Eintrag ein.';
      renderSheet();
      return;
    }
    const p = data.product;
    const n = p.nutriments || {};
    const prod = {
      kind:'off',
      name: p.product_name_de || p.product_name || ('Produkt ' + code),
      brand: p.brands || '',
      per100:{
        kcal:    n['energy-kcal_100g']   || 0,
        fatSat:  n['saturated-fat_100g'] || 0,
        sugar:   n['sugars_100g']        || 0,
        protein: n['proteins_100g']      || 0,
        fiber:   n['fiber_100g']         || 0
      }
    };
    sheet.loading = false;
    if(!prod.per100.kcal){
      sheet.error = 'Für „' + prod.name + '" sind keine Nährwerte hinterlegt. Trag sie als eigenen Eintrag ein.';
      renderSheet();
      return;
    }
    sheet.picked = prod;
    sheet.amount = Number(p.serving_quantity) || 100;
    renderSheet();
  }catch(e){
    console.error(e);
    sheet.loading = false;
    sheet.error = 'Verzeichnis nicht erreichbar. Prüf die Verbindung und versuch es erneut.';
    renderSheet();
  }
}

async function searchOFF(){
  const term = (sheet.query||'').trim();
  if(!term) return;
  sheet.loading = true; sheet.error = ''; sheet.off = [];
  renderSheet();
  try{
    const url = 'https://world.openfoodfacts.org/cgi/search.pl?search_terms='
      + encodeURIComponent(term) + '&search_simple=1&action=process&json=1&page_size=15';
    const res = await fetch(url);
    const data = await res.json();
    sheet.off = (data.products||[]).map(p=>({
      name: p.product_name_de || p.product_name || 'Ohne Namen',
      brand: p.brands || '',
      per100: {
        kcal:    (p.nutriments && p.nutriments['energy-kcal_100g'])   || 0,
        fatSat:  (p.nutriments && p.nutriments['saturated-fat_100g']) || 0,
        sugar:   (p.nutriments && p.nutriments['sugars_100g'])        || 0,
        protein: (p.nutriments && p.nutriments['proteins_100g'])      || 0,
        fiber:   (p.nutriments && p.nutriments['fiber_100g'])         || 0
      }
    })).filter(p=> p.per100.kcal>0);
    if(!sheet.off.length) sheet.error = 'Im Verzeichnis nichts gefunden. Trag es als eigenen Eintrag ein.';
  }catch(e){
    console.error(e);
    sheet.error = 'Verzeichnis nicht erreichbar. Prüf die Verbindung und versuch es erneut.';
  }
  sheet.loading = false;
  renderSheet();
}

document.getElementById('people').onclick = async (e)=>{
  const btn = e.target.closest('[data-person]');
  if(!btn) return;
  person = btn.dataset.person;

  localStorage.setItem('pk_person', person);
  document.getElementById('view').innerHTML = '<p class="muted">Lädt…</p>';
  await loadPersonData();
  render();
};

(async function init(){
  await loadShared();
  await loadPersonData();
  render();
})();
